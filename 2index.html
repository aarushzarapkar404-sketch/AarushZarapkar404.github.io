<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; text-align: center; background: #1c1c1e; color: white; }
    #canvasContainer { width: 90%; max-width: 500px; margin: 20px auto; }
    canvas { background: #2c2c2e; border-radius: 10px; width: 100%; height: 200px; }
  </style>
</head>
<body>

  <h3>Real-Time Lumbar Kinematics</h3>
  <div id="canvasContainer">
    <canvas id="liveGraph" width="500" height="200"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('liveGraph');
    const ctx = canvas.getContext('2d');
    
    // Rolling buffer: 120 points = 2 seconds of data at 60 Hz
    const maxPoints = 120;
    let buffer = new Array(maxPoints).fill(0);

    // 1. Decoupled Sensor Data Collection
    window.addEventListener('devicemotion', (event) => {
      if (event.rotationRate) {
        // Gyroscope Y-axis in deg/s (or convert from rad/s)
        const gyroY = event.rotationRate.beta || 0; 
        buffer.push(gyroY);
        if (buffer.length > maxPoints) buffer.shift();
      }
    });

    // 2. High-Performance 60 FPS Canvas Rendering Loop
    function renderGraph() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw Target Smoothness / Speed Threshold Zone (Green Box)
      ctx.fillStyle = 'rgba(52, 199, 89, 0.15)';
      ctx.fillRect(0, 40, canvas.width, 60); // Visual target target zone

      // Draw Zero Line
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();

      // Draw Real-Time Signal Line
      ctx.strokeStyle = '#007aff';
      ctx.lineWidth = 3;
      ctx.beginPath();

      for (let i = 0; i < buffer.length; i++) {
        const x = (i / (maxPoints - 1)) * canvas.width;
        // Scale factor: Center y-axis at canvas.height/2
        const y = (canvas.height / 2) - (buffer[i] * 1.5); 
        
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Request next animation frame (synchronized with browser refresh rate)
      requestAnimationFrame(renderGraph);
    }

    // Start rendering loop
    requestAnimationFrame(renderGraph);
  </script>
</body>
</html>
